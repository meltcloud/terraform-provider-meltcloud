version: "2"

run:
  timeout: 5m

linters:
  enable:
    - durationcheck
    - errorlint
    - forcetypeassert
    - gocritic
    - godot
    - makezero
    - misspell
    - nilerr
    - predeclared
    - unconvert
    - unparam
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
